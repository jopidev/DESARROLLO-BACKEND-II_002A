spring.application.name=backendpetsalud

# Perfil por defecto: dev (H2 en memoria). En produccion: SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ---------- JWT ----------
# Clave HMAC en Base64 (>= 256 bits). En prod se entrega por variable de entorno JWT_SECRET.
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
jwt.issuer=petsalud-backend

# ---------- CORS ----------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000}

# ---------- JPA ----------
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- Errores: no exponer detalles internos ----------
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
