# Perfil de produccion: MySQL. Todas las credenciales vienen de variables de entorno (nunca en el repositorio).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/petsalud_db?sslMode=REQUIRED&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate

jwt.secret=${JWT_SECRET}

# HTTPS (TLS) en el propio servidor; alternativamente terminar TLS en un proxy/API Gateway
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store=${SSL_KEYSTORE:}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:}
server.ssl.key-store-type=PKCS12
